<!doctype html>
<!--
  页面骨架刻意保持最小：真正的结构（仓库行、变更文件行、续段标识）全部由 app.js 按数据生成。
  之所以不在这里写死结构，是因为布局单元是“行”而不是“卡片”——一张卡片会被列边界切成若干段，
  静态 HTML 无法表达这种结构。

  页面里有 Go 端注入的两个语言占位符：一个用于 <html lang> 属性（供浏览器挑字体、断词与
  朗读规则），一个用于页面内翻译表选语言。它们每次请求都会被替换（见 cmd/ui.go 的 renderIndex），
  因为语言可以在运行期切换，烧死在启动时会拿不到切换后的语言。

  注意：本注释里刻意不写出这两个占位符的字面量。写过一次，而当时 Go 端用的是“只替换第一处”的
  语义，结果注释里那处先被替换掉、真正的 <html lang> 反而原样留下，页面语言因此静默停在英文——
  数据一切正常，只有文案全是英文，排查时很难想到是注释把占位符也替换掉了。
-->
<html lang="__GGT_HTML_LANG__">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ggt</title>
<link rel="stylesheet" href="style.css">
<!--
  主题注入点：服务端把解析好的颜色变量拼成一条 :root 规则写进这里（见 cmd/ui_theme.go）。
  它必须排在样式表之后——样式表里只用变量、不再声明任何颜色值，这里的变量就是唯一来源。
  同一条规则在这里是唯一的注入点，页面上不再有第二处引用它（早期版本把占位符同时写在注释里，
  遇上“只替换第一处”的语义时，先被替换的是注释，真正的注入点反而原样留了下来）
-->
<style id="theme">__GGT_THEME_CSS__</style>
<!-- 显式声明一个空图标：不写这一行，浏览器会自动请求 /favicon.ico，而资产里没有这个文件，
     控制台就会留下一条 404。它不影响功能，但会掩盖真正的报错，也让“控制台无报错”这条
     验收断言失去意义 -->
<link rel="icon" href="data:,">
<script>window.__GGT_LANG__ = "__GGT_LANG_VALUE__";</script>
<!-- 设置快照：页面行为要用的那几个取值（例如通知自动消失的时长）随首页一次带过来，
     免得页面为了一个数字再发一次请求。它按配置注册表生成，页面里出现新的使用点时
     不必动服务端。设置面板不用这份快照——面板每次打开都现取一次，否则命令行改过的
     值要刷新页面才看得见。
     占位符特意与前面的变量名不同名：同名的话 ReplaceAll 会把赋值左边也一起换掉，
     生成一段语法错误的脚本（这一条遇到过，见 renderIndexHTML 的注释） -->
<script>window.__GGT_SETTINGS__ = __GGT_SETTINGS_JSON__;</script>
</head>
<body>
<!-- aria-busy 在首次数据到达前为 true，屏幕阅读器据此知道内容还在加载 -->
<!-- cont-layer 是续段标识的专用容器，本身不在文档流里占位（子元素都是绝对定位，
     放在哪个容器下都不影响坐标）。把它独立成一层是为了让“换掉全部续段标识”变成
     一次 replaceChildren，而不是逐个增删——后者在几万行的看板上代价很大，见 app.js 的 layout -->
<main id="board" aria-busy="true"><div id="cont-layer"></div></main>
<p id="empty" hidden></p>
<!--
  看板底栏，整宽固定在底部。左边是“数据多旧、这次采集花了多久”这行元信息，右边是看板层面的
  动作与它们的结果。

  为什么收进一条底栏：#status 原来是个文档流里的 <p>，而看板的高度按视口算，它因此被顶到
  屏幕之外，实际几乎看不到；#tools 又浮在左下角，会压住最下面一行卡片。两者合成一条之后
  各占一侧，互不重叠，也不再压住内容（列高已按底栏高度让出空间，见 app.js 的 layout）

  结果行（#op）与覆盖层里的 #diff-op 分开：两者可能同时存在（覆盖层打开时底栏被盖住，
  但状态不该丢），共用一个元素会互相覆盖

  层级刻意低于 diff 覆盖层，覆盖层打开时它整条被盖住——这些动作作用于整个看板，
  与正在看的那个仓库的 diff 无关
-->
<div id="tools">
  <p id="status" role="status" aria-live="polite"></p>
  <span id="op" role="status" aria-live="polite"></span>
  <button id="fetch-btn" class="btn btn--primary" type="button"></button>
  <!--
    设置入口：原来的三个主题下拉框已经整体迁进设置面板（面板由服务端按配置注册表生成），
    底栏腾出来的位置给它。图标与铃铛同一套做法——内联 SVG + currentColor，颜色只有一个来源
    （按钮的前景令牌），形状是两条带滑块的横杆：比齿轮更容易用几条路径画准，语义也够清楚
  -->
  <button id="settings-btn" class="btn btn--secondary" type="button">
    <svg class="settings-icon" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" focusable="false">
      <path fill="currentColor" d="M1.5 3.8h7.2v1.4H1.5zM11.3 3.8h3.2v1.4h-3.2zM1.5 10.8h1.2v1.4H1.5zM6.7 10.8h7.8v1.4H6.7z"/>
      <circle fill="currentColor" cx="9.9" cy="4.5" r="2.1"/>
      <circle fill="currentColor" cx="4.9" cy="11.5" r="2.1"/>
    </svg>
  </button>
  <!--
    通知中心入口，摆在底栏最右端（VSCode 的铃铛也在状态栏右端）。
    未读数写进里面的 .badge，由 app.js 维护：徽标那套几何与配色已有现成样式，不再另写一份。
    铃铛用内联 SVG 而不是 emoji 或字符：图标要跟着主题的前景色走，而 emoji 是彩色的、上不了色，
    字形还会随系统字体变形；fill 用 currentColor，颜色仍然只有一个来源（按钮的前景令牌）
  -->
  <button id="bell" class="btn btn--secondary" type="button">
    <svg class="bell-icon" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" focusable="false">
      <path fill="currentColor" d="M4 7a4 4 0 0 1 8 0v3h1v1H3v-1h1z"/>
      <circle fill="currentColor" cx="8" cy="13" r="1.4"/>
    </svg>
    <span id="bell-count" class="badge" hidden></span>
  </button>
</div>
<!--
  右下角的通知堆叠区。为什么挂在 body 上而不是卡片或浮层内部：通知是页面级的东西，
  触发它的动作可能来自看板、仓库卡片或 diff 浮层，挂进任何一层都会跟着那层一起被盖住或随关闭消失。
  层级由样式表给（--z-toast），高于卡片与 diff，也高于提交详情卡——
  用户刚做完一次写操作，结果不该被任何一层浮层压住看不见。

  容器本身不接收指针事件（见样式表），只有单条通知可点：否则这块空白区域会拦住看板的点击。
  内容全部由 app.js 生成，这里只留一个空壳——单条的数目是运行期才知道的
-->
<div id="notifications" aria-live="polite"></div>
<!--
  通知中心浮层：底栏铃铛点开，按时间倒序列出历史通知。
  与 .overlay 那两张卡片不同，它不铺满整页、不要遮罩——它只是个从底栏弹出来的面板，
  盖住右下一角即可，背后该看的还能看（这也是 VSCode 通知中心的形态）。
  结构写死在 HTML 里：面板骨架与数据无关，写在这里能让“页面上有哪几个可聚焦元素”一眼看全
-->
<div id="notif-center" hidden>
  <header>
    <span id="notif-title"></span>
    <button id="notif-clear-all" class="btn btn--secondary" type="button"></button>
  </header>
  <!-- 历史列表：倒序由 app.js 排好后再插进来 -->
  <div id="notif-list"></div>
  <!-- 一条都没有时显示的占位：面板空着会像一个坏掉的控件 -->
  <p id="notif-empty"></p>
</div>
<!--
  diff 视图的容器：覆盖整页替换看板（用户明确要求“点开后整页看 diff，Esc 或返回键回看板”）。
  这里只放固定不变的骨架——标题栏里有返回按钮与 kbd 提示，正文由 app.js 按 /api/diff 的返回填充。
  之所以外壳写在 HTML 而不是像行那样由 JS 生成：行是数据驱动的（数量随数据变化），
  而这个壳的结构与数据无关，放这里能让“页面上有哪几个可聚焦元素”一眼看全。
  默认不带 open 类即不可见（见 style.css），也因此在初始状态下不参与键盘 Tab 序。

  位置很关键：必须排在下面那行 <script> 之前。app.js 是经典脚本（非 defer/module），
  在这一行就同步执行，它开头的 getElementById 会立刻取这几个元素；
  放到脚本之后取到的就是 null，表现为“页面一片空白、控制台报 addEventListener of null”
  ——本轮就是这么踩的，排查时看到的是白屏，很难联想到是标签顺序
-->
<div id="diff" class="overlay" aria-hidden="true">
  <header>
    <button id="diff-back" class="btn btn--secondary" type="button"></button>
    <span id="diff-title"></span>
    <span id="diff-esc"><kbd>Esc</kbd></span>
  </header>
  <!-- 最近一次写操作的结果：成功显示 git 的原话，失败显示 git 的原话或错误。
      单独一行而不是写进正文，是因为正文每次重载都会被重建，提示会被一起冲掉 -->
  <p id="diff-op"></p>
  <div id="diff-body"></div>
</div>
<!--
  仓库卡片：点看板上的仓库名直接进来，默认就是这个仓库的提交分支图。
  它是一层浮在看板之上的圆角卡片（四周留白、圆角、阴影，背后模糊透视看板），与 diff 同一套视觉。
  这里刻意不做“替换整页”的展开：看板始终在后面，关掉卡片就回到刚才看的那一列。

  顶栏放的是“作用在这个仓库上的操作”——分支选择、拉取、同步、推送，以及进入全仓 diff 的入口；
  下面一行是提交信息与提交按钮。两者都在卡片里，不散落到页面别处（这也是不再单独设一个
  仓库面板层的原因：进来就是分支图，仓库操作就在图的上方）
-->
<div id="graph" class="overlay" aria-hidden="true">
  <header>
    <button id="graph-back" class="btn btn--secondary" type="button"></button>
    <span id="graph-title"></span>
    <span id="graph-state"></span>
    <span id="graph-count"></span>
    <!-- 默认跨全部分支与 tag；勾掉就只看当前分支（大仓库的泳道会少很多） -->
    <label id="graph-filter">
      <input id="graph-all-refs" type="checkbox" checked>
      <span id="graph-filter-label"></span>
    </label>
    <select id="graph-branch" disabled></select>
    <button id="graph-fetch" class="btn btn--secondary" type="button"></button>
    <button id="graph-sync" class="btn btn--secondary" type="button"></button>
    <button id="graph-push" class="btn btn--secondary" type="button"></button>
    <button id="graph-diff" class="btn btn--secondary" type="button"></button>
    <span id="graph-esc"><kbd>Esc</kbd></span>
  </header>
  <!-- 提交信息与提交：VSCode 的源码管理视图里这两件也在最上方，与“改动列表”同处一个视图 -->
  <div id="graph-commit">
    <input id="graph-msg" type="text" autocomplete="off" spellcheck="false">
    <button id="graph-commit-btn" class="btn btn--primary" type="button"></button>
  </div>
  <!-- 取数失败或仓库操作的结果（git 的原话）。与 #diff-op 同样的角色，单独一行是因为
       列表每次续取都会重建，写进列表里会被冲掉 -->
  <p id="graph-op"></p>
  <div id="graph-body">
    <div id="graph-list" tabindex="0"></div>
  </div>
</div>
<!--
  设置面板：底栏的设置按钮打开（VSCode 的设置也从齿轮那样的入口进）。
  形态与仓库卡片一致——铺满整页的浮层加居中的圆角卡片，关掉就回到刚才看的那一列。

  为什么单独一个面板，而不放进通知中心或某个卡片里：配置是页面级的东西，与任何一个仓库
  都无关；挂在仓库卡片上会让“它只对当前仓库生效”变成一种很容易产生的误解。

  为什么排在这里（仓库卡片之后、提交详情卡之前）：它与那两个浮层同层（--z-diff），
  谁在后谁压在上面。排在其后，于是“在 diff 或仓库卡片开着时点齿轮”打开的面板一定盖得住
  它们（底栏的层级高于所有浮层，齿轮在那两种情况下本来就点得到），而关掉面板又回到原来那一层。

  骨架写死在这里、每一项由 app.js 按服务端给的元数据生成：骨架与数据无关，而“有哪些配置项”
  必须由服务端说了算——写死在页面里就意味着每加一项配置都要回来改这个文件
-->
<div id="settings" class="overlay" aria-hidden="true">
  <header>
    <button id="settings-back" class="btn btn--secondary" type="button"></button>
    <span id="settings-title"></span>
    <span id="settings-esc"><kbd>Esc</kbd></span>
  </header>
  <!-- 最近一次保存的结果（成功、失败、或“要刷新才生效”）：与 #diff-op、#graph-op 同样的角色。
       面板正文每次保存后都会重建，提示写进正文就会被一起冲掉 -->
  <p id="settings-op"></p>
  <div id="settings-body"></div>
  <footer>
    <span id="settings-path"></span>
    <button id="settings-save" class="btn btn--primary" type="button" disabled></button>
  </footer>
</div>
<!--
  提交详情卡：鼠标移到泳道图上某条提交时贴着光标出现，点一下即钉住（钉住之后不随鼠标移动消失）。
  它挂在 body 上而不是卡片内部：定位要跟光标走，放在有 transform/overflow 的容器里会被裁掉
-->
<div id="graph-popup" class="hovercard" hidden></div>
<script src="app.js"></script>
</body>
</html>
