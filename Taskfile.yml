version: '3'

vars:
  APP: ggt
  VERSION:
    sh: date '+%Y-%m-%d-%H-%M-%S'
  LDFLAGS: '-s -w -X ggt/cmd.Version={{.VERSION}}'

tasks:
  default:
    desc: 完整构建与验证：格式化检查 + 静态检查 + 单元测试 + 全平台编译
    deps:
      - fmt
      - lint
      - test
      - build-all

  # fmt 检查所有 Go 源文件是否已通过 gofmt 格式化
  # 若输出非空则说明有文件未格式化，命令以非零码退出，阻止构建
  fmt:
    desc: 检查 Go 代码格式 (gofmt)
    cmds:
      - 'test -z "$(gofmt -l .)" || (echo "以下文件未通过 gofmt 检查:"; gofmt -l .; exit 1)'

  # lint 执行 go vet 静态检查，捕获明显的代码异味与可疑构造
  lint:
    desc: 静态检查 (go vet)
    cmds:
      - go vet ./...

  # test 运行全部 Go 单元测试，-count=1 禁用缓存确保真实执行
  test:
    desc: 运行所有 Go 单元测试
    cmds:
      - go test ./... -count=1

  build-all:
    desc: Build all platform binaries in parallel
    deps:
      - build:linux:amd64
      - build:linux:arm64
      - build:darwin:amd64
      - build:darwin:arm64
      - build:windows:amd64
      - build:windows:arm64


  build:
    desc: Build for current platform
    cmds:
      - go build -ldflags="{{.LDFLAGS}}" -trimpath -o dist/{{.APP}}{{exeExt}} .
    sources:
      - ./**/*.go
      - go.mod
      - go.sum
    generates:
      - dist/{{.APP}}{{exeExt}}

  build:linux:amd64:
    desc: Cross-compile linux/amd64
    cmds:
      - mkdir -p dist/linux-amd64
      - CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="{{.LDFLAGS}}" -trimpath -o dist/linux-amd64/{{.APP}} .
    sources:
      - ./**/*.go
      - go.mod
      - go.sum
    generates:
      - dist/linux-amd64/{{.APP}}

  build:linux:arm64:
    desc: Cross-compile linux/arm64
    cmds:
      - mkdir -p dist/linux-arm64
      - CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags="{{.LDFLAGS}}" -trimpath -o dist/linux-arm64/{{.APP}} .
    sources:
      - ./**/*.go
      - go.mod
      - go.sum
    generates:
      - dist/linux-arm64/{{.APP}}

  build:darwin:amd64:
    desc: Cross-compile darwin/amd64
    cmds:
      - mkdir -p dist/darwin-amd64
      - CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -ldflags="{{.LDFLAGS}}" -trimpath -o dist/darwin-amd64/{{.APP}} .
    sources:
      - ./**/*.go
      - go.mod
      - go.sum
    generates:
      - dist/darwin-amd64/{{.APP}}

  build:darwin:arm64:
    desc: Cross-compile darwin/arm64
    cmds:
      - mkdir -p dist/darwin-arm64
      - CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -ldflags="{{.LDFLAGS}}" -trimpath -o dist/darwin-arm64/{{.APP}} .
    sources:
      - ./**/*.go
      - go.mod
      - go.sum
    generates:
      - dist/darwin-arm64/{{.APP}}

  build:windows:amd64:
    desc: Cross-compile windows/amd64
    cmds:
      - mkdir -p dist/windows-amd64
      - CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -ldflags="{{.LDFLAGS}}" -trimpath -o dist/windows-amd64/{{.APP}}.exe .
    sources:
      - ./**/*.go
      - go.mod
      - go.sum
    generates:
      - dist/windows-amd64/{{.APP}}.exe

  build:windows:arm64:
    desc: Cross-compile windows/arm64
    cmds:
      - mkdir -p dist/windows-arm64
      - CGO_ENABLED=0 GOOS=windows GOARCH=arm64 go build -ldflags="{{.LDFLAGS}}" -trimpath -o dist/windows-arm64/{{.APP}}.exe .
    sources:
      - ./**/*.go
      - go.mod
      - go.sum
    generates:
      - dist/windows-arm64/{{.APP}}.exe

  clean:
    desc: Remove all build artifacts
    cmds:
      - rm -rf dist/
