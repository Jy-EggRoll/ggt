version: '3'

vars:
  APP: ggt
  # VERSION 与 BUILDTIME 必须写成「优先取环境变量、取不到才回退本机时间」的形态
  # （即 ${VERSION:-<回退值>}），绝不能直接写成 sh: date ...，原因是一个很隐蔽的坑：
  # Task 里用 sh: 定义的变量会**完全盖住**同名环境变量，直接写 date 的话，
  # CI 传进来的标签版本号（VERSION=1.2.3）会被无声丢弃，发布出去的二进制只会
  # 自报一个时间戳版本。后果不只是显示难看——ggt upgrade 靠版本号与上游 Release
  # 比较大小，时间戳版本无法参与比较，自升级会因此彻底失效
  VERSION:
    sh: printf '%s' "${VERSION:-$(date '+%Y-%m-%d-%H-%M-%S')}"
  BUILDTIME:
    sh: printf '%s' "${BUILDTIME:-$(date -u '+%Y-%m-%dT%H:%M:%SZ')}"
  # LDFLAGS 目前只被 build（当前平台）使用：全平台构建已改由 buildall 按 release.json
  # 注入版本信息，不再需要在这里手工拼 -X；保留它是为了 build 这条本地常用路径
  # 仍能带上版本号
  LDFLAGS: '-s -w -X github.com/jy-eggroll/ggt/cmd.Version={{.VERSION}} -X github.com/jy-eggroll/ggt/cmd.BuildTime={{.BUILDTIME}}'
  # l10n 工具的三个位置参数：消息函数所在包、扫描目录、语言文件目录
  # --pkg 指向共享库 eggokit 的 l10n 包：本项目的 L10N 机制已抽到那里，源码仍写同一个 T(...)
  # 扫描范围只含 ggt 自己的 cmd 与 internal，因此 internal/locales 里只保留 ggt 自己的文案
  # 与 internal/locales/locales.go 里的语言列表是一对，改动时要一起看
  L10N_ARGS: '--pkg github.com/jy-eggroll/eggokit/l10n --src cmd,internal --dir internal/locales'

tasks:
  # build（当前平台）仍声明 sources/generates 做增量判断，因此它下面列的资源目录要跟着维护：
  # 除了 Go 源码还列了 internal/locales/*.json——语言文件由 go:embed 打进二进制，
  # 改动它同样需要重新构建，只列 ./**/*.go 的话 Task 会把任务误判为 up-to-date 而沿用旧译文
  # 以后新增任何被 embed 的资源目录，记得同步加进 build 的 sources
  # 注意：build-all 已改为一条 buildall 命令，不做增量判断，因此不受此约束影响
  default:
    desc: 完整构建与验证：格式化检查 + 静态检查 + 单元测试 + 竞态检测 + 全平台编译
    cmds:
      - task: verify
      - task: build-all

  # verify 执行完整的代码质量检查，是发布构建的前置条件
  # 串行执行确保任何一项失败都能立即阻止后续步骤
  verify:
    desc: 完整验证：依赖整理 + 格式化检查 + 静态检查 + 语言文件校验 + 单元测试 + 竞态检测
    cmds:
      - task: mod-tidy
      - task: fmt:check
      - task: vet
      - task: l10n:check
      - task: test
      - task: test:race

  # l10n:check 是语言文件的只读门禁：校验 en.json 与源码一致、语言文件均已按字典序
  # 排列且能被 go-i18n 正常解析、译文没有失效条目。语言由英文源串充当 id，详见
  # eggokit/l10n 的包注释
  l10n:check:
    desc: 校验语言文件（与源码一致、已排序、可被 go-i18n 解析）
    cmds:
      - go run github.com/jy-eggroll/eggokit/l10n/cmd/l10n check {{.L10N_ARGS}}

  # l10n:export 是 l10n:check 的修复动作：重新生成 en.json、重排译文文件，并打印
  # 待翻译清单与尚未迁移的存量中文文案（迁移进度指标）
  l10n:export:
    desc: 重新生成语言文件（覆盖 en.json、重排译文、打印待翻译与待迁移清单）
    cmds:
      - go run github.com/jy-eggroll/eggokit/l10n/cmd/l10n export {{.L10N_ARGS}}

  # mod-tidy 整理 go.mod 和 go.sum，确保依赖一致且无多余条目
  mod-tidy:
    desc: 整理 Go 模块依赖 (go mod tidy)
    cmds:
      - go mod tidy

  # fmt:check 检查所有 Go 源文件是否已通过 gofmt 格式化
  # 若输出非空则说明有文件未格式化，命令以非零码退出，阻止构建
  fmt:check:
    desc: 检查 Go 代码格式 (gofmt)
    cmds:
      - 'test -z "$(gofmt -l .)" || (echo "以下文件未通过 gofmt 检查:"; gofmt -l .; exit 1)'

  # fmt 执行 gofmt 格式化所有 Go 源文件（自动修复）
  fmt:
    desc: 格式化 Go 代码 (gofmt)
    cmds:
      - gofmt -w .

  # vet 执行 go vet 静态检查，捕获明显的代码异味与可疑构造
  vet:
    desc: 静态检查 (go vet)
    cmds:
      - go vet ./...

  # test 运行全部 Go 单元测试，-count=1 禁用缓存确保真实执行
  test:
    desc: 运行所有 Go 单元测试
    cmds:
      - go test ./... -count=1

  # test:race 运行带竞态检测的单元测试，用于检测并发数据竞争
  # 仅在 CI/发布构建中执行，本地开发可跳过以加快反馈速度
  test:race:
    desc: 运行带竞态检测的单元测试
    cmds:
      - go test ./... -count=1 -race

  # verify:actions 是 GitHub Actions 工作流的按需门禁，刻意不挂进 verify：
  # actionlint 是外部工具，缺它不该让日常 verify 失败，CI 上的 verify 也不该依赖它
  # （CI 里那三个工作流本身由 GitHub 侧校验，本地只在改动工作流后手动跑一次）
  # 缺 actionlint 时给出可读的安装提示，而不是以 command not found 收场
  verify:actions:
    desc: 用 actionlint 校验 .github/workflows 下的工作流（按需）
    cmds:
      - |
        set -e
        if ! command -v actionlint >/dev/null 2>&1; then
          echo "缺少 actionlint：本任务用它校验 GitHub Actions 工作流" >&2
          echo "  安装（brew）：brew install actionlint" >&2
          echo "  安装（mise）：mise use -g actionlint" >&2
          exit 1
        fi
        actionlint .github/workflows/*.yml

  # build-all 不再逐个平台列 build:* 任务，而是交给 eggokit 的 buildall 按 release.json 构建，
  # 平台清单从此只有一处真源，增删平台只改清单即可。这消除了旧实现里"Taskfile 列了平台、
  # 升级器的 supportedPlatforms 又列一份"的漂移风险（两者一致性由 cmd 包里的测试把关）
  # 版本与构建时间经 --version/--build-time 显式传入，正是为了把 CI 传进来的标签版本号注入二进制
  build-all:
    desc: 按 release.json 构建所有平台二进制文件
    cmds:
      - go run github.com/jy-eggroll/eggokit/release/cmd/buildall --manifest release.json --version "{{.VERSION}}" --build-time "{{.BUILDTIME}}" --out-dir build --root .

  # build 构建当前平台二进制，保留给本地开发使用；版本信息仍由上面的 LDFLAGS 注入
  build:
    desc: 构建当前平台二进制文件
    cmds:
      - go build -ldflags="{{.LDFLAGS}}" -trimpath -o build/{{.APP}}{{exeExt}} .
    sources:
      - ./**/*.go
      - go.mod
      - go.sum
      - internal/locales/*.json
    generates:
      - build/{{.APP}}{{exeExt}}

  # changelog 生成发布说明并输出到 stdout，供工作流整体重定向进 GitHub Release 正文
  # 旧的 bash 生成逻辑（手写下载表格、awk 摘取 CHANGELOG 小节）已整体删除，
  # 改由 eggokit 的 changelog 工具按 release.json 渲染，各项目共用同一份实现
  # 用法：task changelog VERSION=x.y.z [TYPE=release|dev] [NOTES_LANG=zh-CN|en]
  # NOTES_LANG 留空时**不传** --lang，让 release.json 的 releaseNotesLang 默认语言生效
  # （刻意不叫 LANG：那是系统区域变量，撞名会连带影响该步骤里其它命令的 locale）
  changelog:
    desc: '生成发布更新日志并输出到 stdout（用法: task changelog VERSION=x.y.z [TYPE=release|dev] [NOTES_LANG=zh-CN]）'
    cmds:
      - |
        set -e
        # VERSION 虽是全局变量、正常情况下会回退成时间戳而从不真正为空，这里仍做一次
        # 防御性检查：漏传版本号时应当明确报错，而不是拿一个时间戳去生成"某年某月的更新日志"
        if [ -z "{{.VERSION}}" ]; then
          echo "错误: 需要 VERSION 参数，用法：task changelog VERSION=x.y.z [TYPE=release|dev]" >&2
          exit 1
        fi
        # 用位置参数逐个追加而非拼字符串：NOTES_LANG 为空时不会多出一个空的 --lang，
        # 清单里的默认语言才不会被空值意外覆盖
        set -- --manifest release.json --version "{{.VERSION}}" --type "{{.TYPE}}" --root .
        if [ -n "{{.NOTES_LANG}}" ]; then
          set -- "$@" --lang "{{.NOTES_LANG}}"
        fi
        go run github.com/jy-eggroll/eggokit/release/cmd/changelog "$@"
    vars:
      # TYPE 默认 release：工作流里的正式发布路径不传 TYPE，走这个默认值
      TYPE:
        sh: printf '%s' "${TYPE:-release}"

  clean:
    desc: 清除所有构建产物
    cmds:
      - rm -rf build/
